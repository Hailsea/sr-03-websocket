<!DOCTYPE html>
<html lang="fr" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header th:replace="~{fragments/adminHeader.html :: adminHeader}"></header>

    <main class="container">
        <div class="row mb-4">
            <div class="col-sm-12 text-sm-end">
                <a href="/admin/adduser" class="btn btn-primary shadow-sm">Ajouter un utilisateur</a>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Prénom</th>
                        <th scope="col">Nom</th>
                        <th scope="col">Mail</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${allUsers}">
                        <th th:text="${user.getId()}" scope="row"></th>
                        <td th:text="${user.getFirstname()}"></td>
                        <td th:text="${user.getLastname()}"></td>
                        <td th:text="${user.getEmail()}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
