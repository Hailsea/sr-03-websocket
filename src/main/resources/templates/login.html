<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link th:href="@{/style/style.css}" rel="stylesheet">
</head>
<body>
<main class="center-screen">

    <div th:replace="~{fragments/popup.html :: warningPopup(${popupMessage})}"></div>

    <div class="card form-card">
        <h2>Connexion</h2>

        <form th:action="@{/login}" method="POST">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Entrez votre email" required>
            </div>

            <div class="input-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe" required>
            </div>

            <button type="submit" class="button btn-add">[ Se connecter ]</button>

            <a th:href="@{/resetPassword}" class="form-link">Mot de passe oublié ?</a>
        </form>
    </div>

</main>
</body>
</html>
