<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation du mot de passe</title>
    <link th:href="@{/style/style.css}" rel="stylesheet">
</head>
<body>
<main class="center-screen">

    <div th:replace="~{fragments/popup.html :: warningPopup(${popupMessage})}"></div>

    <div class="card form-card">
        <h2>Mot de passe oublié</h2>

        <form th:action="@{/resetPassword}" method="POST">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Entrez votre email" required>
            </div>

            <button type="submit" class="button btn-add">[ Envoyer ]</button>

            <a th:href="@{/login}" class="form-link">Retour à la connexion</a>
        </form>
    </div>

</main>
</body>
</html>
