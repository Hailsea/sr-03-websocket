<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="formCard(title, actionUrl, id, edit, buttonText, buttonClass, popupMessage)" class="card form-card">
    <h2 th:text="${title}"></h2>
    <div th:replace="~{fragments/popup.html :: warningPopup(${popupMessage})}"></div>
    <form th:action="${actionUrl}" method="POST">

        <div class="input-group">
            <label for="firstname">Prénom</label>
            <input type="text" id="firstname" name="firstname" placeholder="Prénom"
                   th:value="${user?.firstname}" required>
        </div>

        <div class="input-group">
            <label for="lastname">Nom</label>
            <input type="text" id="lastname" name="lastname" placeholder="Nom"
                   th:value="${user?.lastname}" required>
        </div>

        <div class="input-group">
            <label for="email">Mail</label>
            <input type="email" id="email" name="email" placeholder="nom@exemple.com"
                   th:value="${user?.email}" required>
        </div>

        <div class="input-group">
            <span th:if="${edit=='true'}">
                <input  type="hidden" name="id" th:value="${id}">
            </span>
            <span th:unless="${edit=='true'}">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="Mot de passe" required>
                <label for="password_confirmation">Confirmer le mot de passe</label>
                <input type="password" id="password_confirmation" name="password_confirmation" placeholder="Confirmer le mot de passe" required>
            </span>

        </div>

        <input type="hidden" name="edit" th:value="${edit}">

        <div class="button-group">
            <a th:href="@{/admin/}" class="button btn-classic">[ Retour ]</a>
            <button type="submit" th:class="${buttonClass} +' ' + button" th:text="'[ ' + ${buttonText} + ' ]'"></button>
        </div>

    </form>
</div>

</body>
</html>
