<!DOCTYPE html>
<html lang="fr" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">
    <link th:href="@{/style/style.css}" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.24/js/jquery.dataTables.min.js"></script>
    <script>
        $(document).ready(function() {
            // 'tip' = tableau + info + pagination uniquement.
            // La recherche et le filtre statut sont places dans la barre d'outils (au-dessus)
            // pour maitriser la mise en page et rester dans le theme.
            var table = $('#users').DataTable({
                dom: 'tip',
                language: {
                    info: 'Affichage de _START_ à _END_ sur _TOTAL_ utilisateurs',
                    infoEmpty: 'Aucun utilisateur',
                    infoFiltered: '(filtré sur _MAX_ au total)',
                    emptyTable: 'Aucun utilisateur en base',
                    zeroRecords: 'Aucun résultat',
                    paginate: { previous: 'Précédent', next: 'Suivant' }
                }
            });
            // Recherche en direct, branchée sur le moteur de DataTables
            $('#userSearch').on('keyup', function() {
                table.search(this.value).draw();
            });
            // Nombre de lignes par page (remplace le "Show N entries" par defaut)
            $('#pageLen').on('change', function() {
                table.page.len(parseInt(this.value, 10)).draw();
            });
        });
    </script>

</head>
<body>
<header th:replace="~{fragments/adminHeader.html :: adminHeader}"></header>

<div th:replace="~{fragments/popup.html :: warningPopup(${popupMessage})}"></div>

<main class="">

    <div class="card table-card">
    <div class="header-row">
        <div>
            <h1>UTILISATEURS</h1>
        </div>
        <div>
            <a href="/admin/adduser" class="button btn-add">[ + AJOUTER ]</a>
        </div>
    </div>

    <!-- Barre d'outils : utilisateur connecte + filtre statut + recherche -->
    <div class="toolbar">
        <p class="current-user">
            Connecté en tant que
            <strong th:text="${currentUser.firstname + ' ' + currentUser.lastname}">Admin</strong>
            <span class="current-user-mail" th:text="${currentUser.email}"></span>
        </p>

        <div class="toolbar-controls">
            <!-- Filtre statut : recharge la liste avec ?status=... (auto-submit au changement) -->
            <form th:action="@{/admin}" method="GET" class="control">
                <label for="status">Statut</label>
                <select id="status" name="status" class="field" onchange="this.form.submit()">
                    <option value="all"      th:selected="${status == 'all'}">Tous</option>
                    <option value="active"   th:selected="${status == 'active'}">Actifs</option>
                    <option value="inactive" th:selected="${status == 'inactive'}">Désactivés</option>
                </select>
            </form>

            <!-- Recherche : filtre cote client via DataTables -->
            <div class="control">
                <label for="userSearch">Recherche</label>
                <input type="text" id="userSearch" class="field" placeholder="Nom, prénom, email...">
            </div>

            <!-- Nombre de lignes par page : branche sur DataTables (remplace le "Show entries") -->
            <div class="control">
                <label for="pageLen">Par page</label>
                <select id="pageLen" class="field">
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>
        </div>
    </div>

    <div class="table-responsive">
        <table id="users" class="table-striped">
            <thead>
            <tr>
                <th>ID</th>
                <th>PRENOM</th>
                <th>NOM</th>
                <th>EMAIL</th>
                <th>ROLE</th>
                <th>ACTIVE</th>
                <th>ACTIONS</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${allUsers}">
                <td th:text="${user.getId()}"></td>
                <td th:text="${user.getFirstname()}"></td>
                <td th:text="${user.getLastname()}"></td>
                <td th:text="${user.getEmail()}"></td>
                <td th:text="${user.getAdmin()}==true?'Admin':'Utilisateur'"></td>
                <td th:text="${user.getAlive()}?'Actif':'Désactivé'"></td>
                <td class="button-group">
                    <a th:href="@{/admin/user/{id}(id=${user.getId()})}" class="button btn-classic">
                        [ VOIR ]
                    </a>
                    <form th:action="@{/admin/edituser}" th:method="POST" class="button btn-classic">
                        <input type="hidden" name="idUser" th:value="${user.id}"/>
                        <button type="submit">[ Modifier ]</button>
                    </form>
                    <form th:action="@{/admin/deleteuser}" th:method="POST" class="button btn-classic">
                        <input type="hidden" name="idUser" th:value="${user.id}"/>
                        <button type="submit">[ Supprimer ]</button>
                    </form>
                    <form th:action="@{/admin/resetpassword}" th:method="POST" class="button btn-classic">
                        <input type="hidden" name="email" th:value="${user.email}"/>
                        <button type="submit">[ Réinitialiser mot de passe ]</button>
                    </form>
                    <form th:action="@{/admin/toggleactive}" th:method="POST" class="button btn-classic">
                        <input type="hidden" name="idUser" th:value="${user.id}"/>
                        <button type="submit" th:text="${user.getAlive()} ? '[ Désactiver ]' : '[ Activer ]'"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    </div>
</main>
</body>
</html>
