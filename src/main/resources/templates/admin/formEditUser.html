<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier l'utilisateur</title>
    <link th:href="@{/style/style.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/adminHeader.html :: adminHeader}"></header>

<main>
    <div th:replace="~{fragments/userForm.html :: formCard(
        title='Modifier l\'utilisateur \#' + ${user.id},
        actionUrl=@{/admin/saveuser},
        id=${user.id},
        edit='true',
        buttonText='Mettre à jour',
        buttonClass='btn-update',
        popupMessage=${popupMessage})}">
    </div>

</main>

</body>
</html>
